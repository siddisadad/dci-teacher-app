name: Release

on:
  push:
    branches: [ dev, main, R1, R2, R3 ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android Release
    runs-on: ubuntu-latest
    env:
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || '1:185309718906:android:b7183fa10298724e6d8ec3' }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve build version
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //; s/+.*//; s/[[:space:]]//g')
          CODE=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/.*+//; s/[[:space:]]//g')
          BUILD=$(( ${{ github.run_number }} + CODE ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$NAME versionCode=$BUILD"

      - name: Configure Android signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice title=Signing Fallback::ANDROID_KEYSTORE_BASE64 not set. Using Gradle debug signing fallback."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            sed -i '/^storeFile=/d' android/key.properties
            echo "storeFile=$KEYSTORE_PATH" >> android/key.properties
          else
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "::error title=Missing Config::ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEY_PROPERTIES is not provided."
              exit 1
            fi
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "storeFile=$KEYSTORE_PATH"
            } > android/key.properties
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Android APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Firebase App Distribution
        if: secrets.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ env.FIREBASE_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            Release: ${{ github.ref_name }}
            Build: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
            Message: ${{ github.event.head_commit.message || 'Manual build' }}

      - name: Google Play Store
        if: steps.signing.outputs.ready == 'true' && secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.dciteacherapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'alpha' }}
          status: completed
          changesNotSentForReview: true

  web:
    name: Web Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  firebase:
    name: Firebase Configs, Rules & Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firebase Artifacts
        if: secrets.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > sa_key.json
          firebase deploy --only firestore,storage,functions,hosting --project d-c-i-teacher-app-lffjyu --credential sa_key.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
