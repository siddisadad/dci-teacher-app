name: Flutter CI/CD

on:
  push:
    branches: [ dev, main, R1 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev, main, R1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  firestore_rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test deps
        run: npm --prefix tests ci

      - name: Run Firestore rules tests
        run: firebase emulators:exec --only firestore "npm --prefix tests test"

  release_android:
    name: AAB → App Distribution → Play
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID || '1:185309718906:android:b7183fa10298724e6d8ec3' }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
      HAS_PLAY: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve build version
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//; s/[[:space:]]//g')
          CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//; s/[[:space:]]//g')
          BUILD=$(( ${{ github.run_number }} + CODE ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$NAME versionCode=$BUILD"

      - name: Configure Android signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Skipping signed Android release, Firebase App Distribution, and Play upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            sed -i '/^storeFile=/d' android/key.properties
            echo "storeFile=$KEYSTORE_PATH" >> android/key.properties
          else
            if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "::error::Set ANDROID_KEYSTORE_PASSWORD (or ANDROID_KEY_PROPERTIES) in GitHub secrets."
              exit 1
            fi
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "storeFile=$KEYSTORE_PATH"
            } > android/key.properties
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build Android App Bundle
        if: steps.signing.outputs.ready == 'true'
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build Android APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload AAB artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Locate R8 mapping file
        if: steps.signing.outputs.ready == 'true'
        id: mapping
        run: |
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            echo "file=build/app/outputs/mapping/release/mapping.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Firebase App Distribution
        if: steps.signing.outputs.ready == 'true' && env.HAS_FIREBASE == 'true'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ env.FIREBASE_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.ref_name }} (${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }})
            ${{ github.event.head_commit.message }}

      - name: Skip Firebase App Distribution
        if: steps.signing.outputs.ready == 'true' && env.HAS_FIREBASE != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT_JSON is not set. Skipping Firebase App Distribution."

      - name: Google Play Closed Testing
        if: >-
          steps.signing.outputs.ready == 'true' &&
          env.HAS_PLAY == 'true' &&
          startsWith(github.ref, 'refs/tags/v') == false
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.dciteacherapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: alpha
          tracks: alpha
          status: completed
          changesNotSentForReview: true
          whatsNewDirectory: .github/whatsnew
          mappingFile: ${{ steps.mapping.outputs.file }}

      - name: Skip Google Play Closed Testing
        if: steps.signing.outputs.ready == 'true' && env.HAS_PLAY != 'true'
        run: echo "::warning::PLAY_STORE_SERVICE_ACCOUNT_JSON is not set. Skipping Play Closed Testing and production."

      - name: Google Play Closed Testing + Release
        if: >-
          steps.signing.outputs.ready == 'true' &&
          env.HAS_PLAY == 'true' &&
          startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.dciteacherapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: alpha,production
          status: completed
          changesNotSentForReview: true
          whatsNewDirectory: .github/whatsnew
          mappingFile: ${{ steps.mapping.outputs.file }}

  build_web:
    name: Build Web
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
