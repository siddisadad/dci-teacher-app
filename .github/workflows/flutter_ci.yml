name: Flutter CI/CD

on:
  push:
    branches: [ dev, main, R1 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ dev, main, R1 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  firestore_rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install rules test deps
        run: npm --prefix tests ci

      - name: Run Firestore rules tests
        run: firebase emulators:exec --only firestore "npm --prefix tests test"

  build_android:
    name: Build Android Release
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/R1' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get Version
        id: version
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//; s/[[:space:]]//g')
          CODE=$(grep '^version:' pubspec.yaml | sed 's/.*+//; s/[[:space:]]//g')
          BUILD=$(( ${{ github.run_number }} + CODE ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$NAME versionCode=$BUILD"

      - name: Setup Signing
        id: signing
        env:
          # Check both secrets and vars in case they were misconfigured
          SEC_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SEC_KEY_PROPS: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          VAR_KEYSTORE_B64: ${{ vars.ANDROID_KEYSTORE_BASE64 }}
          VAR_KEY_PROPS: ${{ vars.ANDROID_KEY_PROPERTIES }}
          
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Prioritize secrets over vars
          B64="${SEC_KEYSTORE_B64:-$VAR_KEYSTORE_B64}"
          PROPS="${SEC_KEY_PROPS:-$VAR_KEY_PROPS}"
          
          if [ -z "$B64" ] && [ -z "$PROPS" ]; then
            echo "::warning::Signing secrets (ANDROID_KEYSTORE_BASE64 or ANDROID_KEY_PROPERTIES) not found in secrets or vars. Skipping signed Android release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          
          if [ -n "$B64" ]; then
            echo "$B64" | base64 --decode > "$KEYSTORE_PATH"
          fi
          
          if [ -n "$PROPS" ]; then
            printf '%s\n' "$PROPS" > android/key.properties
            # Force the storeFile path to the local decoded file
            sed -i '/^storeFile=/d' android/key.properties
            echo "storeFile=$KEYSTORE_PATH" >> android/key.properties
          else
            # Manual fallback if key.properties is not provided
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
              echo "storeFile=$KEYSTORE_PATH"
            } > android/key.properties
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build App Bundle
        if: steps.signing.outputs.ready == 'true'
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Build APK
        if: steps.signing.outputs.ready == 'true'
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload AAB artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Upload APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Firebase App Distribution
        if: steps.signing.outputs.ready == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.ref_name }} (${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }})
            ${{ github.event.head_commit.message }}

      - name: Google Play Store
        if: steps.signing.outputs.ready == 'true' && secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.dciteacherapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'alpha' }}
          status: completed
          changesNotSentForReview: true

  deploy_firestore:
    name: Deploy Firestore Rules
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Rules
        if: secrets.FIREBASE_SERVICE_ACCOUNT_JSON != ''
        run: firebase deploy --only firestore:rules,firestore:indexes --project d-c-i-teacher-app-lffjyu
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  build_web:
    name: Build Web
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
